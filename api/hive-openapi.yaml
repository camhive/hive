openapi: 3.1.0
info:
  title: Camhive Hive local API
  version: 0.0.1
  description: |
    Served by the hive on the owner's server (loopback by default; reached
    remotely through the relay or LAN per ADR-0010). Every request except
    /healthz carries an access token issued by the cloud (ADR-0004) as
    `Authorization: Bearer <paseto>`. Error bodies always have a stable `code`.

    Local emergency login (#57, ADR-0004): when the owner has enabled it
    (`PUT /v0/local-login` with a cloud token), `POST /v0/local-login/sessions`
    signs the owner in with a local username and password and returns a
    token the hive issued itself (PASETO v4.local, owner role, all cameras,
    one hour). The sign-in and local tokens work only on the LAN listener,
    from private or link-local addresses; through the relay, on the loopback
    listener or from a loopback peer they answer `403 lan_only`. Five failed sign-ins in 15
    minutes lock a source address (an IPv6 /64) for 15 minutes, fifty from
    anywhere lock all sources (`429 local_login_rate_limited` with
    `Retry-After`); an attempt counts before its password is checked.
    Changing or disabling the login, here or with `hive local-login` on the
    hive's console, ends every local session.

    Moving the data (#155): while `hive move-data` copies the hive to a new
    disk the hive answers without recording, and every change (POST, PUT,
    PATCH, DELETE) answers `409 moving`, since it would stay on the old disk;
    reads, the local sign-in and unlocking, locking and presence of the
    archive go on.

    Archive encryption at rest (ADR-0019): off until the owner switches it on
    with a passphrase (`POST /v0/archive/encryption`). From then on the hive
    seals closed segments and stored exports to the archive key; after every
    start of the hive the archive is **locked** until the owner unlocks it
    (`POST /v0/archive/encryption/unlock`). While locked, playback, sound,
    starting an export and downloading one answer `423 archive_locked`;
    recording, live view, the calendar and the timeline go on. Every member
    reads the state at `GET /v0/archive/encryption`. Enable, unlock (and a
    wrong passphrase), lock, passphrase change and key-file download are
    recorded in the action log (`archive.encryption.*`) and, except the
    download, sent to the cloud without the passphrase. Five wrong
    passphrases in 15 minutes refuse checks for 15 minutes
    (`429 unlock_rate_limited` with `Retry-After`).

    Plan limits apply to remote requests only (#58). Requests that come
    through the cloud relay are remote: a token with `quality: sub` gets the
    sub stream for archive playback, exports and live offers whatever
    `stream` asks for (main when the camera has no sub stream), and exports
    are capped at the token's `export_max_minutes` (`403 plan_limit`). On the
    LAN the hive serves the requested stream and does not cap exports.

    CORS: every response carries `Access-Control-Allow-Origin: *` and the
    preflight allows `Authorization`, `Content-Type` and `Range` plus
    `Access-Control-Allow-Private-Network: true`, so the web app on the cloud
    origin can call the hive on the LAN (`<id>.h.camhive.app`) or through the
    relay (`<id>.relay.camhive.app`). Bearer tokens, never cookies, carry the
    identity, so a permissive origin policy exposes nothing (ADR-0012).
servers:
  - url: http://127.0.0.1:16016
security:
  - accessToken: []
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: PASETO v4.public (cloud) or v4.local (local session, LAN only)
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code.
          enum: [token_missing, token_invalid, token_expired, clock_skew, wrong_hive, license_required, forbidden, not_found, invalid, bad_json, not_ready, engine, unsupported, camera, camera_auth, plan_limit, internal, lan_only, local_login_disabled, local_login_rate_limited, invalid_credentials, weak_password, invalid_update_window, updates_unavailable, archive_locked, encryption_on, encryption_off, wrong_passphrase, unlock_rate_limited, moving]
        message: { type: string }
    NotRecording:
      type: object
      required: [since, reason]
      description: |
        The hive does not record (#172, ADR-0024 amendment): since when and why, from the hive's
        recording watchdog, which checks once a minute. disk_not_mounted: the mount point (fstab) that
        holds the archive is not mounted, or, from a hive waiting at start, the data directory's disk is
        missing (the hive then answers only /healthz); archive_missing: the archive directory is
        gone (its disk's mount vanished); archive_changed: it is on another disk than when the hive
        started (restart the hive once the disk is back); archive_unwritable: it cannot be read, or a
        test write into it failed, at two checks in a row; database: the hive's database answered with
        I/O, corruption or read-only errors twice in a row; engine_stalled: a camera is online but no
        new segment for recording_stall_minutes plus a segment's length, at two checks.
      properties:
        since: { type: string, format: date-time }
        reason: { type: string, enum: [disk_not_mounted, archive_missing, archive_changed, archive_unwritable, database, engine_stalled] }
        detail: { type: string, description: "What was seen (paths, errors); only in /healthz to programs on this machine" }
    HiveInfo:
      type: object
      required: [version, capabilities, archive_encryption]
      properties:
        version: { type: string, example: "0.1.6", description: "The running hive version" }
        not_recording:
          description: "Present while the hive does not record (#172); absent while it records, and from hives older than 0.1.11"
          allOf: [{ $ref: "#/components/schemas/NotRecording" }]
        archive_encryption:
          type: string
          enum: [off, locked, unlocked]
          description: "Archive encryption (ADR-0019), as GET /v0/archive/encryption answers it: locked means playback and exports wait for the owner"
        capabilities:
          type: array
          items: { type: string }
          example: [archive.delete, archive.encryption, camera.identity, local_login, motion, updates]
          description: |
            What this hive's software can do (ADR-0022), sorted. Names are never removed or
            renamed; an incompatible change gets a new name. A hive that reports no list
            (v0.1.6 or older) has the v0.1.6 baseline.
    UpdateSettings:
      type: object
      required: [updates, update_window, update_channel]
      description: "The owner's update choices (ADR-0018 §6), stored in hive.yaml; hive-updater reads them at every check and within 30 s of a change."
      properties:
        updates: { type: string, enum: [automatic, manual], description: "manual: install only on Update now" }
        update_window: { type: string, example: "02:00-05:00", description: "HH:MM-HH:MM in the hive's local time, may cross midnight; two different times (else 400 invalid_update_window)" }
        update_channel: { type: string, enum: [stable, beta] }
    UpdateStatus:
      allOf:
        - $ref: "#/components/schemas/UpdateSettings"
        - $ref: "#/components/schemas/UpdateReports"
        - type: object
          required: [running, supported]
          properties:
            running: { type: string, example: "0.1.6" }
            supported: { type: boolean, description: "false: this build never updates itself" }
            unsupported_reason: { type: string, enum: [dev_build, no_root, no_updater], description: "From what started this hive: dev_build: hive-updater is a local build; no_root: hive-updater has no trusted update root; no_updater: hive-updater did not start this hive (it runs in the foreground, or no updater is installed)" }
            settings_need_restart: { type: boolean, description: "The running hive-updater reads hive.yaml only at start (older than v0.1.7): a changed setting applies after the service restarts" }
    UpdateReports:
      type: object
      description: What hive-updater reported into the activity log
      properties:
        available: { type: string, example: "0.1.8", description: "The version waiting (update.available): in manual mode for Update now, in automatic mode for the update window; newer than what runs and not rolled back" }
        needs_package: { type: string, example: "0.2.0", description: "A version that needs a newer hive-updater (update.needs_package): install the current package; Update now cannot install it" }
        last:
          type: object
          required: [action, from, to, at]
          description: The updater's last update or rollback, from the activity log
          properties:
            action: { type: string, enum: [update.applied, update.rolled_back] }
            from: { type: string }
            to: { type: string }
            at: { type: string, format: date-time }
    Source:
      type: object
      required: [kind, address]
      properties:
        kind: { type: string, enum: [onvif, rtsp] }
        address: { type: string, description: ONVIF device service URL or RTSP URL (credentials are moved out) }
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, writeOnly: true }
    Stream:
      type: object
      properties:
        URL: { type: string }
        ProfileToken: { type: string }
        Codec: { type: string }
        Width: { type: integer }
        Height: { type: integer }
    Camera:
      type: object
      required: [id, name, group, source, streams, enabled, record_audio, created_at, updated_at]
      properties:
        id: { type: string, example: cam_3f9a1c2b7d4e }
        name: { type: string, maxLength: 100 }
        group: { type: string, maxLength: 100 }
        source: { $ref: "#/components/schemas/Source" }
        credentials:
          type: object
          description: Present for owners only; the password is never returned.
          properties:
            username: { type: string }
        streams:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Stream" }
        enabled: { type: boolean }
        record_audio: { type: boolean, description: "Sound is pulled and recorded only when true (ADR-0015); false by default" }
        retention_days:
          type: integer
          minimum: 0
          maximum: 3650
          description: "The camera's own retention in days (#61); 0 keeps footage until space runs out. Absent: the hive-wide retention_days from hive.yaml applies. The plan's archive.retention_days_max caps both."
        identity:
          description: "What the camera is, learned by the hive (ADR-0017); owners only, read-only"
          allOf: [{ $ref: "#/components/schemas/CameraIdentity" }]
        network:
          type: string
          enum: [local, routed]
          description: "local: in one of the hive's networks, found again after an address change; routed: behind a router, reserve its address. Absent until known."
        sensitivity:
          type: string
          enum: [low, normal, high]
          description: "How readily motion detection reacts (#157, capability camera.sensitivity); normal is ADR-0020's defaults"
        motion_calmed_since:
          type: string
          format: date-time
          description: "Present while the hive has calmed the camera: it raised more than 20 motion episodes in an hour, so the threshold is one step higher until an hour passes without one (#157)"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CameraIdentity:
      type: object
      properties:
        mac: { type: string, example: "aa:bb:cc:00:11:22" }
        onvif_endpoint: { type: string, example: "urn:uuid:5f0c…" }
        serial: { type: string }
        manufacturer: { type: string }
        model: { type: string }
    StreamInput:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "rtsp://host[:port]/path without credentials" }
        profile_token: { type: string }
        codec: { type: string }
        width: { type: integer }
        height: { type: integer }
    Discovered:
      type: object
      required: [xaddr, name, scopes]
      properties:
        xaddr: { type: string, description: "ONVIF device service URL" }
        name: { type: string }
        scopes: { type: array, items: { type: string } }
    ProbeResult:
      type: object
      required: [device, profiles]
      properties:
        device:
          type: object
          properties:
            Manufacturer: { type: string }
            Model: { type: string }
            FirmwareVersion: { type: string }
            SerialNumber: { type: string }
            HardwareID: { type: string }
        profiles:
          type: array
          items:
            type: object
            required: [token, name, encoding, width, height, fps, url]
            properties:
              token: { type: string }
              name: { type: string }
              encoding: { type: string }
              width: { type: integer }
              height: { type: integer }
              fps: { type: integer }
              url: { type: string, description: "RTSP URL for this profile (credentials removed)" }
    CameraCreate:
      type: object
      required: [name, source]
      properties:
        streams:
          type: object
          description: "Stream URLs per name (main, sub): for ONVIF cameras picked from a probe; RTSP cameras derive main from the address and may name a sub stream."
          additionalProperties: { $ref: "#/components/schemas/StreamInput" }
        name: { type: string }
        group: { type: string }
        source: { $ref: "#/components/schemas/Source" }
        credentials: { $ref: "#/components/schemas/Credentials" }
    Segment:
      type: object
      properties:
        start: { type: string, format: date-time }
        duration_ms: { type: integer }
        bytes: { type: integer }
        complete: { type: boolean, description: false for the file still being written }
        activity: { $ref: "#/components/schemas/Activity" }
    Activity:
      type: object
      description: "Profile of a segment from its first video frame (ADR-0015): hints for the timeline, not detections. Absent until the hive has read the file."
      required: [step_s, video_kbps]
      properties:
        step_s: { type: integer, description: seconds per value }
        video_kbps: { type: array, items: { type: integer }, description: "video bit rate; movement raises it" }
        sound_db: { type: array, items: { type: integer }, description: "sound level in dBFS, -90 for silence; absent without recorded audio" }
    ExportCreate:
      type: object
      required: [start, duration_seconds]
      properties:
        stream: { type: string, enum: [main, sub], default: main }
        start: { type: string, format: date-time }
        duration_seconds: { type: integer, minimum: 1, maximum: 86400 }
    Export:
      type: object
      properties:
        id: { type: string, example: exp_1a2b3c4d5e6f }
        camera: { type: string }
        stream: { type: string }
        start: { type: string, format: date-time }
        duration_seconds: { type: integer }
        status: { type: string, enum: [running, done, failed] }
        error: { type: string }
        bytes: { type: integer }
        file_name: { type: string }
        created_at: { type: string, format: date-time }
    DeletionRequest:
      type: object
      description: >-
        What to delete (ADR-0016): every stream of the cameras between from and
        to. Whole segments that touch the range go, so the deleted span can be
        wider than asked, never narrower.
      properties:
        cameras: { type: array, items: { type: string }, description: "Absent: every camera with footage; must not be empty" }
        from: { type: string, format: date-time, description: "Absent: from the beginning" }
        to: { type: string, format: date-time, description: "Absent or in the future: now" }
        include_exports: { type: boolean, default: false, description: "Also delete exports of that footage" }
        dry_run: { type: boolean, default: false, description: "Only report what would be deleted" }
    Deletion:
      type: object
      properties:
        cameras:
          type: array
          items:
            type: object
            properties:
              camera: { type: string }
              from: { type: string, format: date-time, description: "Start of the first whole segment deleted" }
              to: { type: string, format: date-time, description: "End of the last whole segment deleted" }
              segments: { type: integer, description: "Files, both streams, including pending" }
              bytes: { type: integer }
              pending: { type: integer, description: "Files still being written; deleted once closed" }
        exports:
          type: object
          properties:
            count: { type: integer }
            bytes: { type: integer }
    StreamHealth:
      type: object
      properties:
        stream: { type: string }
        online: { type: boolean }
        since: { type: string, format: date-time }
        bitrate_kbps: { type: integer }
        bytes_received: { type: integer }
        tracks: { type: array, items: { type: string } }
        readers: { type: integer }
        last_error: { type: string }
    CameraHealth:
      type: object
      properties:
        camera: { type: string }
        enabled: { type: boolean }
        online: { type: boolean, description: follows the main stream }
        streams: { type: object, additionalProperties: { $ref: "#/components/schemas/StreamHealth" } }
        care: { $ref: "#/components/schemas/CareSummary", description: "Camera care (#163); absent on hives without it" }
    Event:
      type: object
      description: "A timeline Event (ADR-0009, ADR-0020). `id` is stable; a lasting Event (motion, storage.low, disk.failing, disk.failed) is listed from its start, also on later days while it goes on, and gains `end` when it is over."
      properties:
        id: { type: integer, description: "Stable for the Event's life on this hive" }
        camera: { type: string, description: "Empty for the hive's own Events (storage.low, disk.failing, disk.failed)" }
        kind: { type: string, enum: [camera.online, camera.offline, camera.address_changed, camera.identity_changed, storage.low, disk.failing, disk.failed, motion, camera.degraded] }
        at: { type: string, format: date-time, description: "When it happened or began" }
        end: { type: string, format: date-time, description: "When it ended: equal to `at` for an instantaneous Event, absent while a lasting Event is still going on" }
        data: { type: object, additionalProperties: true, description: "motion: `source` = camera | frames; storage.low: `free_bytes`, `min_free_gb`; disk.failing and disk.failed: `device`, `evidence` (DiskEvidence); camera.degraded: `reasons` at its start" }
    CameraPatch:
      type: object
      properties:
        name: { type: string }
        group: { type: string }
        enabled: { type: boolean }
        record_audio: { type: boolean, description: "Pull and record the camera's sound (ADR-0015); off unless the owner switches it on" }
        host: { type: string, description: "Move the camera to this host or IP, keeping ports and paths (ADR-0017)", example: "192.168.1.23" }
        replace_identity: { type: boolean, description: "Accept a device at the new host that is not the known camera (it was replaced)" }
        sub_stream: { type: string, description: "RTSP cameras: the sub stream's rtsp(s) URL without credentials; an empty string removes the sub stream; 422 for ONVIF cameras, whose sub stream comes from a probe (capability camera.sub_stream)", example: "rtsp://192.168.1.50:554/ch1" }
        retention_days:
          type: [integer, "null"]
          minimum: 0
          maximum: 3650
          description: "Owner only. Keep this camera's footage this many days (0 = until space runs out); null puts it back on the hive-wide retention_days. The sweep applies it within five minutes; the plan's archive.retention_days_max caps it. Announced as capability camera.retention (from v0.1.9; v0.1.8 takes it without announcing it)."
        sensitivity:
          type: string
          enum: [low, normal, high]
          description: "Owner only. Motion sensitivity (#157, capability camera.sensitivity); anything else is 422 invalid"
        credentials: { $ref: "#/components/schemas/Credentials" }
    LocalLogin:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, description: "false: the hive holds no local credential at all" }
        username: { type: string }
        updated_at: { type: string, format: date-time }
    LocalCredentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 10, maxLength: 256, writeOnly: true, description: "10-256 characters, not the username; stored as an argon2id hash" }
    LocalSession:
      type: object
      required: [token, session_id, expires_at, role, cameras, local]
      properties:
        token: { type: string, description: "PASETO v4.local; send as Bearer on the LAN listener only" }
        session_id: { type: string }
        expires_at: { type: string, format: date-time }
        role: { type: string, enum: [owner] }
        cameras: { type: array, items: { type: string }, description: "always [*]" }
        local: { type: boolean, enum: [true] }
    ArchiveEncryption:
      type: object
      required: [state, sealing]
      properties:
        sealing:
          type: boolean
          description: "New footage is being sealed. False while off; false while on means the hive cannot read the archive's public key (a damaged disk, a file removed by hand): footage stays in clear until the owner unlocks the archive, which writes the key again. Show it as a warning."
        state:
          type: string
          enum: [off, locked, unlocked]
          description: "off: footage is stored in clear. locked: new footage is sealed, nothing sealed can be played until the owner unlocks. unlocked: everything plays."
        autolock:
          $ref: "#/components/schemas/Autolock"
    AutolockSettings:
      type: object
      description: "The owner's automatic-lock settings (#147, ADR-0019 addendum); both off by default."
      properties:
        after:
          type: string
          enum: ["off", "1h", "8h", "24h", "7d"]
          description: "Lock after this long without a playback, its sound, a new export or an export download by anyone; the unlock counts as activity."
        away:
          type: string
          enum: ["off", "10m", "1h"]
          description: "Lock this long after the owner's app reported that it left home (POST /v0/archive/encryption/presence); an at-home report within it cancels the lock."
    Autolock:
      description: "The automatic lock, in GET /v0/archive/encryption and its other answers for the owner only (Members would learn when the owner left home). Absent on a hive without the archive.autolock capability."
      allOf:
        - $ref: "#/components/schemas/AutolockSettings"
        - type: object
          required: [after, away]
          properties:
            locks_at:
              type: string
              format: date-time
              description: "When the unlocked archive will lock itself if nothing changes; absent while no timer runs (both off, at home, or not unlocked). The hive checks twice a minute."
            reason:
              type: string
              enum: [inactivity, away]
              description: "Which timer locks first; present with locks_at."
    Presence:
      type: object
      required: [at_home]
      properties:
        at_home:
          type: boolean
          description: "The app reaches the hive on the LAN (its transport decision is lan or address). Counts only when the request arrives on the hive's LAN listener from a private or link-local address (loopback refused), the rule of the local login: through the relay, a tunnel or a forwarded port the owner is away."
    Passphrase:
      type: object
      required: [passphrase]
      properties:
        passphrase: { type: string, minLength: 10, maxLength: 256, writeOnly: true, description: "10-256 characters (the password policy); the current one when changing it" }
        new_passphrase: { type: string, minLength: 10, maxLength: 256, writeOnly: true, description: "POST /v0/archive/encryption/passphrase only" }
    StorageOverview:
      type: object
      required: [cameras]
      description: |
        The archive disk, every camera's footage and the forecast (#150, ADR-0024). The arithmetic is
        the website calculator's (docs/dev/sizing.md, "The storage arithmetic"), on measured bytes.
        disk, settings and forecast are the owner's; a member gets only the cameras the token covers
        that still exist, each with id, name, bytes and days_held.
      properties:
        cameras: { type: array, items: { $ref: "#/components/schemas/CameraStorage" } }
        disk: { $ref: "#/components/schemas/StorageDisk" }
        settings: { $ref: "#/components/schemas/StorageSettings" }
        forecast: { $ref: "#/components/schemas/StorageForecast" }
    CameraStorage:
      type: object
      required: [id, bytes, days_held]
      description: "One camera's footage in the index, main and sub stream together; only cameras with footage are listed. Fields after days_held are the owner's."
      properties:
        id: { type: string }
        name: { type: string, description: "Absent for the footage of a removed camera (owner only)" }
        bytes: { type: integer, format: int64 }
        days_held: { type: number, description: "Newest minus oldest, in days" }
        oldest: { type: string, format: date-time, description: Start of the oldest segment }
        newest: { type: string, format: date-time, description: End of the newest segment }
        oldest_age_days: { type: number, description: "Now minus the oldest segment's start, in days: what the age rule compares with the retention" }
        bytes_per_day_24h: { type: integer, format: int64, description: "Bytes of the segments that started in the last 24 hours over the time since the first of them (a camera that resumed after a gap is not diluted); rounded up" }
        bytes_per_day_7d: { type: integer, format: int64, description: The same over the last 7 days }
        retention_days: { type: integer, description: "The days retention keeps (the camera's own or the hive's, licence cap applied); 0 = until space runs out" }
        follows_hive: { type: boolean, description: "The camera follows the hive-wide retention_days (no retention of its own)" }
        effective_days: { type: integer, description: What the camera will hold once the settings converge; less than retention_days when the disk runs out first }
    StorageDisk:
      type: object
      required: [total_bytes, archive_bytes, export_bytes, free_bytes]
      properties:
        total_bytes: { type: integer, format: int64, description: Size of the archive's volume }
        archive_bytes: { type: integer, format: int64, description: Footage in the index }
        export_bytes: { type: integer, format: int64, description: Exports kept on the hive }
        free_bytes: { type: integer, format: int64, description: "Available to the hive (Bavail), as the space rule measures it" }
        health: { $ref: "#/components/schemas/DiskHealth" }
    DiskHealth:
      type: object
      description: "The archive disk's last health check (#155, ADR-0024 §6), at start and every 30 minutes. Owner only."
      required: [state, evidence]
      properties:
        state: { type: string, enum: [unknown, ok, failing, failed], description: "unknown: nothing could be read (no smartctl, no kernel log, not Linux); failing: replace the disk soon; failed: the archive cannot be written and recording has stopped" }
        checked_at: { type: string, format: date-time, description: Absent before the first check }
        device: { type: string, description: "The whole disk the archive is on, e.g. /dev/sdb" }
        temperature_c: { type: integer, description: "From SMART, when it reports one" }
        evidence: { type: array, items: { $ref: "#/components/schemas/DiskEvidence" } }
    DiskEvidence:
      type: object
      required: [signal, detail]
      properties:
        signal: { type: string, enum: [smart, kernel, writes, probe] }
        detail: { type: string, description: "One line in English for the owner and the logs" }
        values: { type: object, additionalProperties: { type: integer, format: int64 }, description: "smart: passed, reallocated_sectors, pending_sectors, offline_uncorrectable, reported_uncorrectable, percentage_used, media_errors, critical_warning; kernel: io_errors; writes: eio, read_only, enospc" }
    DataMove:
      type: object
      description: "The last `hive move-data` (#155), as the command reports it while it runs and after it finished."
      required: [state, supported, files]
      properties:
        state: { type: string, enum: [none, copying, switching, done, failed], description: "none: no move was started from this data directory; copying: the hive answers but does not record; switching (the new directory's note): everything is copied and the service is being pointed here; failed: cancelled" }
        supported: { type: boolean, description: "The hive runs as a systemd service on Linux, which `hive move-data` can point at a new directory" }
        data_dir: { type: string, description: The data directory the hive runs from }
        archive_dir: { type: string, description: "archive_dir of hive.yaml; may be outside the data directory" }
        files:
          type: array
          description: "The files to save first by hand, hardest to replace first, where they really are (hive.yaml is in /etc/camhive on a default Linux install)"
          items: { type: object, required: [name, path], properties: { name: { type: string }, path: { type: string } } }
        unreadable_segments: { type: integer, description: "Segments the old disk could not read; left behind" }
        unreadable_bytes: { type: integer, format: int64 }
        from: { type: string }
        to: { type: string }
        step: { type: string, description: "What is being copied: hive.key, cloud.json, hive.yaml, archive-key, hive.db, exports, archive, index, service" }
        copied_bytes: { type: integer, format: int64 }
        planned_bytes: { type: integer, format: int64, description: Bytes the move will copy in all }
        skipped_segments: { type: integer, description: "Segments that did not fit on the new disk; they stay on the old one" }
        skipped_bytes: { type: integer, format: int64 }
        skipped_newest: { type: string, format: date-time, description: The start of the newest footage that did not fit }
        started_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        error: { type: string }
    StorageSettings:
      type: object
      required: [retention_days, min_free_gb, export_max_gb]
      properties:
        retention_days: { type: integer, description: "Hive-wide retention in days; 0 = until space runs out" }
        min_free_gb: { type: integer, description: "Free space the space rule keeps, in GiB; 0 (set by hand) turns the rule off" }
        export_max_gb: { type: integer, description: "The exports' share of the disk, in GiB; set in hive.yaml only" }
        retention_days_max: { type: integer, description: "The licence's cap on every retention (archive.retention_days_max); absent when none" }
    StorageForecast:
      type: object
      required: [bytes_per_day, capacity_bytes, disk_days, retention_met, deleting_for_space]
      properties:
        bytes_per_day: { type: integer, format: int64, description: "Every camera's rate, the larger of its two windows; 0 when nothing is recorded" }
        capacity_bytes: { type: integer, format: int64, description: "archive + exports + free - min_free_gb - export_max_gb: what the archive may fill" }
        disk_days: { type: integer, description: Whole days capacity_bytes holds at bytes_per_day }
        horizon_days: { type: integer, description: "How far back the space rule lets footage reach; absent when retention is met" }
        needed_bytes: { type: integer, format: int64, description: "Space retention needs at these rates, the reserve included; absent when a recording camera keeps footage without limit" }
        fills_in_days: { type: integer, description: "Whole days until the space rule starts deleting, counting only cameras still short of their retention (0: within a day); absent when retention is met or the growth stops first" }
        retention_met: { type: boolean }
        deleting_for_space: { type: boolean, description: "The last retention sweep deleted footage for space or could not reach the floor" }
    StoragePatch:
      type: object
      additionalProperties: false
      description: An absent field keeps its value.
      properties:
        retention_days: { type: integer, minimum: 0, maximum: 3650, description: "0 = until space runs out" }
        min_free_gb: { type: integer, minimum: 1, description: "GiB; smaller than the disk. 0 (no space rule) only by hand in hive.yaml" }
    CareReason:
      type: string
      enum: [bitrate_drop, frame_loss, reconnects, clock_drift, offline_pattern, night_picture, stream_changed]
      description: "Why a camera is degraded (#163): bitrate_drop, a stream sent less than 60 % of its usual bitrate at this clock hour over the last hour (usual: the same hour of the last 7 days, from 3 days of history); frame_loss, more than 30 s of footage missing in the last hour (offline time and the hive's own downtime excluded), or segments late on 3 checks in a row while online; reconnects, 4 or more in the last hour; clock_drift, the ONVIF camera's clock off by more than 30 s at the last reading (every 6 h); offline_pattern, offline 5 minutes or more in the same hour on 3 of the last 7 days; night_picture, a night hour below 60 % of the camera's earlier nights and 25 % of its day (the IR illuminator), cleared by day; stream_changed, codec or resolution changed in the last 24 h without the owner"
    CareSummary:
      type: object
      required: [degraded, reasons]
      properties:
        degraded: { type: boolean }
        reasons: { type: array, items: { $ref: "#/components/schemas/CareReason" } }
    VideoTrack:
      type: object
      properties:
        codec: { type: string, example: H264 }
        width: { type: integer, description: "0: not known" }
        height: { type: integer }
    CameraCare:
      type: object
      description: "What camera care (#163) says about a camera, checked every 5 minutes. Bitrate, missing footage and reconnects cover the last hour; the clock and a stream change are single readings; the offline pattern covers a week. Each reason clears only past a level of its own, so it does not flap. One degraded episode is one camera.degraded Event, ended by camera.recovered."
      required: [camera, checked_at, degraded, reasons, signals, thresholds]
      properties:
        camera: { type: string }
        checked_at: { type: [string, "null"], format: date-time, description: "null before the first check (a few minutes after the hive starts)" }
        degraded: { type: boolean }
        since: { type: string, format: date-time, description: "The episode's start; absent while not degraded" }
        reasons:
          type: array
          items:
            type: object
            required: [reason, suggestion]
            properties:
              reason: { $ref: "#/components/schemas/CareReason" }
              suggestion: { type: string, description: "Plain-language advice in English; the app shows its own translation by reason", example: "Check the cable or the PoE budget." }
        signals:
          type: object
          required: [streams, missing_s, late_s, reconnects_hour, reconnects_24h, clock_drift_s, clock_checked_at, offline_minutes, pattern_hours, stream_change]
          properties:
            streams:
              type: array
              items:
                type: object
                properties:
                  stream: { type: string }
                  last_hour_kbps: { type: integer, description: "0: under half an hour of footage in the last hour" }
                  usual_kbps: { type: integer, description: "Median of the same clock hour and the hours beside it on the last 7 days; 0: fewer than 3 days of history" }
                  day_kbps: { type: integer, description: "Median of the day hours; 0: not known yet" }
                  night: { type: boolean }
            missing_s: { type: number, description: "Footage of the main stream missing in the last hour; time the camera was offline and time before the hive or its engine last started excluded" }
            late_s: { type: number, description: "How long the next segment is overdue while the camera is online; a reason after 3 checks in a row, not while storage.low is open" }
            reconnects_hour: { type: integer }
            reconnects_24h: { type: integer, description: "Counted since the hive started, at most 24 hours back" }
            clock_drift_s: { type: [number, "null"], description: "The camera's clock minus the hive's, read every 6 hours from ONVIF cameras; null: not read" }
            clock_checked_at: { type: [string, "null"], format: date-time }
            offline_minutes:
              type: array
              description: The last 7 local days, today last
              items: { type: object, properties: { day: { type: string, format: date }, minutes: { type: integer } } }
            pattern_hours: { type: array, items: { type: integer, minimum: 0, maximum: 23 }, description: "Local hours of day of the offline pattern" }
            stream_change:
              type: [object, "null"]
              properties:
                stream: { type: string }
                at: { type: string, format: date-time }
                from: { $ref: "#/components/schemas/VideoTrack" }
                to: { $ref: "#/components/schemas/VideoTrack" }
        thresholds:
          type: object
          description: Where each signal becomes a reason and where it clears
          properties:
            bitrate_drop: { type: number }
            bitrate_ok: { type: number }
            night_picture: { type: number }
            night_ok: { type: number }
            missing_s: { type: number }
            missing_ok_s: { type: number }
            reconnects: { type: integer }
            reconnects_ok: { type: integer }
            clock_drift_s: { type: number }
            clock_every_h: { type: integer }
            pattern_days: { type: integer }
            pattern_minutes: { type: integer }
            stream_changed_h: { type: integer }
            baseline_days: { type: integer }
            baseline_min_days: { type: integer }
            late_checks: { type: integer }
  responses:
    ArchiveLocked:
      description: "`code: archive_locked` — the archive is encrypted and locked until its owner unlocks it (ADR-0019)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Missing, invalid, expired or foreign token.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: The token's role does not allow this.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Unknown camera, or a camera the token does not cover.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
paths:
  /:
    get:
      security: []
      summary: Landing page after opening the hive at its LAN address
      description: >
        ADR-0023: in an emergency the app sends the user to
        `https://<lan-address>:<port>/` in a new tab; after they proceed
        through the browser's certificate warning (a name mismatch for the
        hive's LAN name) this page tells them to return to the app. Static
        HTML in English or German by the first language of
        `Accept-Language`; it carries nothing about the hive (no version,
        id or name, no links) and needs no token. Only on the LAN
        listener: through the relay and on the loopback listener the root
        answers `404 not_found`.
      responses:
        "200":
          description: "The page"
          content:
            text/html:
              schema: { type: string }
        "404":
          description: "Not on the LAN listener"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /healthz:
    get:
      security: []
      summary: Liveness and version
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  version: { type: string }
                  recording: { type: integer, description: "Cameras recording now; only to programs on this machine (the updater, ADR-0018): loopback, not relayed, no Origin header" }
                  not_recording:
                    description: "Present while the hive does not record (#172), with the detail; only to programs on this machine (`hive status`). The status stays ok: liveness is not recording."
                    allOf: [{ $ref: "#/components/schemas/NotRecording" }]
                  updates:
                    description: "What hive-updater did and offers; only to programs on this machine (`hive status`, #109): loopback, not relayed, no Origin header, so never to a web page. Absent when the activity log cannot be read within a second."
                    allOf: [{ $ref: "#/components/schemas/UpdateReports" }]
  /v0/hive:
    get:
      summary: The hive's version and capabilities (any Member)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/HiveInfo" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v0/hive/updates:
    get:
      summary: Update settings and status (owner, #82)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateStatus" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { description: "internal: hive.yaml or the activity log could not be read or written", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "not_ready: the hive is still starting", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      summary: Change the update settings (owner); action-logged as update.settings_changed
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateSettings" } } }
      responses:
        "200": { description: The stored settings and the status, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateStatus" } } } }
        "400": { description: "invalid_update_window, invalid (mode or channel) or bad_json", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { description: "internal: hive.yaml or the activity log could not be read or written", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "not_ready: the hive is still starting", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v0/hive/updates/install:
    post:
      summary: Update now (owner); the same request as `hive update`, taken by hive-updater within 30 s
      description: "Installs what is offered whatever the mode or window. The result (update.applied or update.rolled_back) reaches the activity log; the request is logged as update.requested."
      responses:
        "202": { description: Requested, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { description: "internal: hive.yaml or the activity log could not be read or written", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "not_ready: the hive is still starting", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "updates_unavailable: this build never updates itself", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v0/cameras:
    get:
      summary: Cameras the token may view
      responses:
        "200":
          description: "OK"
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Camera" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Add a camera (owner)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CameraCreate" } } }
      responses:
        "201":
          description: "Created"
          content: { application/json: { schema: { $ref: "#/components/schemas/Camera" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "Validation failed (`code: invalid`)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v0/cameras/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: One camera
      responses:
        "200": { description: "OK", content: { application/json: { schema: { $ref: "#/components/schemas/Camera" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Change name, group, enabled, sound, credentials or host (owner)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CameraPatch" } } }
      responses:
        "200": { description: "OK", content: { application/json: { schema: { $ref: "#/components/schemas/Camera" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`code: camera_mismatch` — another device answers at the new host; resend with replace_identity if the camera was replaced."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: "Validation failed (`code: invalid`)."
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      summary: Remove a camera (owner); recordings are kept
      responses:
        "204": { description: Removed (or already absent). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v0/cameras/{id}/archive/calendar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: stream, in: query, schema: { type: string, enum: [main, sub], default: main } }
      - { name: tz, in: query, schema: { type: string }, description: IANA zone for day boundaries; default is the hive's zone }
    get:
      summary: Days with footage (viewer; through the relay for the stream the token's quality serves, like playback)
      responses:
        "200":
          description: "OK"
          content: { application/json: { schema: { type: array, items: { type: object, properties: { day: { type: string, example: "2026-11-09" } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/cameras/{id}/archive/timeline:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: stream, in: query, schema: { type: string, enum: [main, sub], default: main } }
      - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
      - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
    get:
      summary: Segments overlapping [from, to) (viewer; through the relay for the stream the token's quality serves, like playback)
      responses:
        "200": { description: "OK", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Segment" } } } } }
        "400": { description: "`code: invalid`" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/cameras/{id}/archive/play:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: stream, in: query, schema: { type: string, enum: [main, sub], default: main } }
      - { name: start, in: query, required: true, schema: { type: string, format: date-time } }
      - { name: duration, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 86400 }, description: seconds }
    get:
      summary: Archive playback as fragmented MP4 (viewer; through the relay a sub-quality token gets the sub stream)
      responses:
        "200":
          description: OK
          headers:
            X-Camhive-Stream: { description: "The stream actually served (main or sub); differs from the request through the relay or for a camera without the requested stream", schema: { type: string, enum: [main, sub] } }
          content: { video/mp4: {} }
        "404": { $ref: "#/components/responses/NotFound" }
        "423": { $ref: "#/components/responses/ArchiveLocked" }
        "502": { description: "`code: engine` — playback unavailable" }
  /v0/cameras/{id}/archive/audio:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: stream, in: query, schema: { type: string, enum: [main, sub], default: main } }
      - { name: start, in: query, required: true, schema: { type: string, format: date-time } }
      - { name: duration, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 60 }, description: seconds }
    get:
      summary: "Recorded sound of a span as WAV, for the player's sound button (viewer; ADR-0015). Same stream rules as playback."
      responses:
        "200":
          description: OK
          headers:
            X-Camhive-Stream: { description: "The stream actually served (main or sub)", schema: { type: string, enum: [main, sub] } }
          content: { audio/wav: {} }
        "400": { description: "`code: invalid` — bad span, or longer than 60 s" }
        "404": { description: "`code: no_audio` — no sound recorded (camera without microphone or recording sound switched off); or the camera is unknown", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: "`code: audio_unsupported` — sound recorded in a format the hive does not convert yet (only G.711/LPCM)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "423": { $ref: "#/components/responses/ArchiveLocked" }
        "502": { description: "`code: engine` — playback unavailable" }
  /v0/cameras/{id}/exports:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Start an export of a time span (operator; through the relay the token's quality and export cap apply)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExportCreate" } } }
      responses:
        "202": { description: "Accepted", content: { application/json: { schema: { $ref: "#/components/schemas/Export" } } } }
        "403": { description: "`code: forbidden` (not an operator) or `code: plan_limit` (longer than the token allows, through the relay only)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "`code: invalid`" }
        "423": { $ref: "#/components/responses/ArchiveLocked" }
  /v0/exports:
    get:
      summary: The caller's exports, newest first
      responses:
        "200": { description: "OK", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Export" } } } } }
  /v0/archive/deletions:
    post:
      summary: Preview or delete recordings (owner, ADR-0016); irreversible without dry_run, and audited as archive.delete
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DeletionRequest" } } }
      responses:
        "200": { description: "What was (or, with dry_run, would be) deleted", content: { application/json: { schema: { $ref: "#/components/schemas/Deletion" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "`code: export_running` — an export of that footage is still being made", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "`code: invalid` — no cameras, or the start is not before the end", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`code: not_ready` — the archive is not available yet", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v0/archive/encryption:
    get:
      summary: Whether the archive is encrypted and locked (every member)
      responses:
        "200": { description: "OK", content: { application/json: { schema: { $ref: "#/components/schemas/ArchiveEncryption" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Switch encryption on with a passphrase (owner signed in through Camhive; a local session gets 403); the archive is left unlocked
      description: |
        Irreversible in this version. Footage recorded from now on is sealed
        when its segment closes (2-minute segments), and so are the segments
        and exports already there, in the background. Without the passphrase
        and the key file (`GET /v0/archive/encryption/key-file`) nobody can
        play the sealed footage again. Recorded as `archive.encryption.enable`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Passphrase" } } }
      responses:
        "200": { description: "Enabled", content: { application/json: { schema: { $ref: "#/components/schemas/ArchiveEncryption" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "`code: encryption_on`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "`code: weak_password`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v0/archive/encryption/unlock:
    post:
      summary: Unlock the archive with the passphrase (owner, a local emergency session included); the key stays in the hive's memory until lock or restart
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Passphrase" } } }
      responses:
        "200": { description: "Unlocked", content: { application/json: { schema: { $ref: "#/components/schemas/ArchiveEncryption" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`code: forbidden` (not the owner) or `code: wrong_passphrase`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`code: encryption_off`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429":
          description: "`code: unlock_rate_limited`; `Retry-After` says when to try again"
          headers:
            Retry-After: { schema: { type: integer }, description: seconds }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v0/archive/encryption/lock:
    post:
      summary: Lock the archive again (owner, a local emergency session included); the key is wiped from memory
      responses:
        "200": { description: "Locked", content: { application/json: { schema: { $ref: "#/components/schemas/ArchiveEncryption" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "`code: encryption_off`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v0/archive/encryption/passphrase:
    post:
      summary: Change the passphrase (owner signed in through Camhive; a local session gets 403); the key and the footage stay the same, an earlier key file keeps the old passphrase
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Passphrase" } } }
      responses:
        "204": { description: "Changed; locked or unlocked as before" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`code: forbidden` (not the owner) or `code: wrong_passphrase` (the current one)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`code: encryption_off`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: "`code: weak_password` (the new one)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429":
          description: "`code: unlock_rate_limited`"
          headers:
            Retry-After: { schema: { type: integer }, description: seconds }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v0/archive/encryption/key-file:
    get:
      summary: Download the key file, the owner's backup (owner signed in through Camhive; a local session gets 403)
      description: |
        The keyring as the hive stores it: an age v1 file encrypted with the
        passphrase (scrypt), holding an age identity file with one
        `AGE-SECRET-KEY-1…` line per key, newest last. Useless without the
        passphrase; with it, `age -d` recovers the keys and they open the
        `.mp4.age` segments without Camhive. Recorded as
        `archive.encryption.key_file`.
      responses:
        "200":
          description: "The key file"
          headers: { Content-Disposition: { schema: { type: string }, description: "attachment; filename=\"camhive-archive-key-<hive id>.age\"" } }
          content: { application/octet-stream: {} }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "`code: encryption_off`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v0/archive/encryption/autolock:
    patch:
      summary: Set the automatic lock (owner signed in through Camhive; a local session gets 403)
      description: |
        A field left out keeps its value; at least one is required. A change
        that makes the archive lock later (a timer switched off or made
        longer) takes the owner at home, on the hive's LAN address from a
        machine in the local network; through the relay or a forwarded port
        it answers 403 `lan_only`, so a stolen token cannot relax the lock.
        Stricter changes work from anywhere. The settings persist in the hive's
        store and apply while the archive is unlocked; unlocking stays
        manual. Recorded as `archive.encryption.autolock`. When a timer
        fires, the hive locks the archive as `POST /v0/archive/encryption/lock`
        does and records `archive.encryption.lock` with actor `hive` and
        `reason: inactivity | away`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AutolockSettings" } } }
      responses:
        "200": { description: "Set", content: { application/json: { schema: { $ref: "#/components/schemas/ArchiveEncryption" } } } }
        "400": { description: "`code: invalid` — not one of the choices, or nothing to change", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "`code: forbidden` (not the owner signed in through Camhive) or `code: lan_only` (relaxing the lock from outside the home network)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`code: not_ready` — automatic locking is not available", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v0/archive/encryption/presence:
    post:
      summary: The owner's app reports whether it is at home (owner, a local emergency session included)
      description: |
        Sent when a page that holds a connection to the hive opens, when the
        app's transport decision changes, after an unlock and once a minute
        while the page is open; at most once a minute. Leaving
        starts the `away` grace period (repeated reports keep its start); a
        return cancels it. Advisory: an app that is closed reports nothing,
        and the inactivity timer is the fallback. Kept in memory only, not
        recorded.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Presence" } } }
      responses:
        "204": { description: "Taken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: "`code: not_ready` — automatic locking is not available", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v0/exports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Export status (own jobs only; others look absent)
      responses:
        "200": { description: "OK", content: { application/json: { schema: { $ref: "#/components/schemas/Export" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/exports/{id}/file:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Download the finished file
      description: Plain MP4 with range requests. With encryption on the hive keeps the file sealed and decrypts it for the download.
      responses:
        "200": { description: "OK", content: { video/mp4: {} }, headers: { Content-Disposition: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "`code: not_ready` — still running or failed" }
        "423": { $ref: "#/components/responses/ArchiveLocked" }
  /v0/cameras/{id}/health:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Live health of one camera (viewer)
      responses:
        "200": { description: "OK", content: { application/json: { schema: { $ref: "#/components/schemas/CameraHealth" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/health/cameras:
    get:
      summary: Health of every camera the token may view
      responses:
        "200": { description: "OK", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CameraHealth" } } } } }
  /v0/cameras/{id}/events:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
      - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
    get:
      summary: Timeline events in [from, to) (viewer)
      description: "The camera's Events and the hive's own (camera empty) that begin before `to` and end at or after `from` or are still going on, oldest first."
      responses:
        "200": { description: "OK", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Event" } } } } }
        "400": { description: "`code: invalid`" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/cameras/{id}/ptz:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Whether the camera supports PTZ (viewer)
      responses:
        "200": { description: "OK", content: { application/json: { schema: { type: object, properties: { supported: { type: boolean } } } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /v0/cameras/{id}/ptz/move:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Start continuous movement (operator); call stop to end it
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { pan: { type: number, minimum: -1, maximum: 1 }, tilt: { type: number, minimum: -1, maximum: 1 }, zoom: { type: number, minimum: -1, maximum: 1 } } } } }
      responses:
        "204": { description: Moving. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "`code: unsupported`" }
        "422": { description: "`code: invalid`" }
        "502": { description: "`code: camera` — the camera rejected the command" }
  /v0/cameras/{id}/ptz/stop:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Stop movement (operator)
      responses:
        "204": { description: Stopped. }
        "409": { description: "`code: unsupported`" }
  /v0/cameras/{id}/ptz/presets:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Stored positions (operator)
      responses:
        "200": { description: "OK", content: { application/json: { schema: { type: array, items: { type: object, properties: { token: { type: string }, name: { type: string } } } } } } }
  /v0/cameras/{id}/ptz/presets/{preset}/goto:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: preset, in: path, required: true, schema: { type: string } }
    post:
      summary: Move to a stored position (operator)
      responses:
        "204": { description: Moving to the preset. }
        "502": { description: "`code: camera`" }
  /v0/cameras/{id}/live/offer:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Local WebRTC signalling — forward a WHEP offer to the engine and return its answer (viewer; the app uses it at home, on the LAN path or in local mode, ADR-0013)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sdp]
              properties:
                sdp: { type: string }
                stream: { type: string, enum: [main, sub], default: main }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [sdp, session]
                properties:
                  sdp: { type: string }
                  session: { type: string, description: "opaque handle for /v0/live/candidates and /v0/live/close" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`code: invalid`"
        "502":
          description: "`code: engine`"
        "503":
          description: "`code: not_ready` — engine not running"
  /v0/live/candidates:
    post:
      summary: Trickle ICE candidates for a local signalling session (RFC 8840 fragment)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session, candidates]
              properties:
                session: { type: string }
                candidates: { type: string }
      responses:
        "204": { description: Forwarded. }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`code: invalid`"
  /v0/live/close:
    post:
      summary: End a local signalling session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session]
              properties:
                session: { type: string }
      responses:
        "204": { description: Closed. }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "`code: invalid`"
  /v0/discovery:
    get:
      summary: ONVIF cameras answering WS-Discovery on the LAN (owner)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Discovered" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: "`code: camera` — discovery failed"
        "503":
          description: "`code: not_ready` — discovery not available"
  /v0/discovery/probe:
    post:
      summary: Read an ONVIF device's information and profiles with stream URLs (owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, description: "ONVIF device service URL" }
                credentials: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/ProbeResult" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "`code: invalid`"
        "502":
          description: "`code: camera_auth` when the camera rejected the credentials, `code: camera` otherwise"
  /v0/actions:
    parameters:
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
    get:
      summary: Activity on this hive, newest first (owner)
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    at: { type: string, format: date-time }
                    actor: { type: string, description: "account id, system or cloud" }
                    action: { type: string, example: camera.add }
                    target: { type: string }
                    details: { type: object }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v0/local-login:
    get:
      summary: Whether the local emergency login is enabled (owner)
      responses:
        "200":
          description: "OK"
          content: { application/json: { schema: { $ref: "#/components/schemas/LocalLogin" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      summary: Enable the local login or change its credentials (owner with a cloud token)
      description: Ends every local session. A local session gets `403 forbidden`. Recorded as `local_login.enable`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LocalCredentials" } } }
      responses:
        "200":
          description: "Enabled"
          content: { application/json: { schema: { $ref: "#/components/schemas/LocalLogin" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: "`weak_password` or `invalid` (username)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      summary: Disable the local login and delete its credentials (owner with a cloud token)
      description: Ends every local session. Recorded as `local_login.disable`.
      responses:
        "204": { description: "Disabled" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v0/local-login/sessions:
    post:
      security: []
      summary: Sign in locally (LAN listener only, no token)
      description: |
        Every verified attempt is recorded (`local_login.success`,
        `local_login.failure`), and so is a lockout (`local_login.locked`).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LocalCredentials" } } }
      responses:
        "201":
          description: "Signed in"
          content: { application/json: { schema: { $ref: "#/components/schemas/LocalSession" } } }
        "401":
          description: "`invalid_credentials`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: "`lan_only` (relay, loopback listener or peer, public source address) or `local_login_disabled`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: "`local_login_rate_limited`; `Retry-After` says when to try again"
          headers:
            Retry-After: { schema: { type: integer }, description: seconds }
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v0/storage:
    get:
      summary: The archive disk, every camera's footage and the forecast (#150)
      description: "Owner and members; a member sees only the cameras the token covers, without disk, settings and forecast. A local session (#57) reads it too."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/StorageOverview" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: "internal: the index, the disk or the database could not be read", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "not_ready: the archive is not available yet", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v0/hive/storage:
    patch:
      summary: Change retention_days and min_free_gb (owner through Camhive); action-logged as storage.settings_changed
      description: "Written to hive.yaml and to the running retention sweeper: the next sweep (at most 5 minutes) applies them, no restart. Lowering retention_days or raising min_free_gb can delete footage at that sweep. Only the fields sent are validated: a min_free_gb of 0 set by hand stands. A local session (#57) is refused."
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StoragePatch" } } }
      responses:
        "200": { description: The overview with the new settings, content: { application/json: { schema: { $ref: "#/components/schemas/StorageOverview" } } } }
        "400": { description: "bad_json (not whole numbers, unknown fields)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { description: "invalid: retention_days outside 0-3650, or min_free_gb sent below 1 or not smaller than the disk", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: "internal: hive.yaml could not be written", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "not_ready: the archive is not available yet", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v0/hive/move:
    get:
      summary: The state of `hive move-data`, for the guided disk replacement (#155)
      description: "Owner only. The move itself runs as `hive move-data <new-dir>` as root on the hive's computer; while it copies, the hive answers without recording."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DataMove" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { description: "internal: move.json could not be read", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v0/cameras/{id}/care:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Camera care, the camera's signals and what to do (viewer, #163)
      description: "Owner and members who may view the camera."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CameraCare" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: "not_ready: camera care is not running (no video engine)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
